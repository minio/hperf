name: Go
on:
  pull_request:
    branches:
    - master
    - main
  push:
    branches:
    - master
    - main
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ 1.26.x ]
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
    - name: Check formatting
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      shell: bash
    - name: Build
      run: go build ./...
      shell: bash
    - name: Vet
      run: go vet ./...
      shell: bash
    - name: Lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout 5m
    - name: Test
      run: go test -race -count 1 -timeout 10m ./...
      shell: bash
    # The concurrency fixes are the kind that pass once and fail on the tenth
    # run, and single-proc scheduling exposes different interleavings.
    - name: Test concurrency repeatedly
      run: |
        for procs in 1 4; do
          GOMAXPROCS=$procs go test -race -count 10 -timeout 15m \
            -run 'RaceFree|Concurrent|Ingest|Reclaim|Duplicate|Releases' \
            ./server/... ./client/...
        done
      shell: bash

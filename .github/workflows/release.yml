name: Release
on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Linux release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ 1.26.x ]
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        # goreleaser needs the tags and the full history for the changelog
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
    - name: Test
      run: go test -race -count 1 -timeout 10m ./...
      shell: bash
    - name: Release
      uses: goreleaser/goreleaser-action@v6
      with:
        version: '~> v2'
        args: release --clean --config .goreleaser.linux.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
